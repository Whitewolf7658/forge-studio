name: Spectra Core portable Windows app
on:
  push:
    branches: [main, spectra-core-local-ai]
  workflow_dispatch:
jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify local agent
        run: python -m unittest discover -s local_core/tests -v
      - name: Build studio frontend
        run: |
          npm install
          npm run build
      - name: Package standalone local server
        run: |
          python -m pip install pyinstaller
          pyinstaller --clean --onefile --name Spectra-Core --distpath portable --add-data "dist;dist" local_core/server.py
      - uses: actions/upload-artifact@v4
        with:
          name: Spectra-Core-Windows
          path: portable/Spectra-Core.exe
          retention-days: 30
          if-no-files-found: error
