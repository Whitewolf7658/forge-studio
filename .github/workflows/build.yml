name: Spectra Studio checks
on:
  push:
    branches: [main, spectra-studio-rewrite, spectra-creator-workspace, spectra-core-local-ai, spectra-school-browser-core]
  pull_request:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s local_core/tests -v
      - run: npm install
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:browser